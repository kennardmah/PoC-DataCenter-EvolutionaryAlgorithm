    \ Each job has sequential operations with fixed machine types\n\u2022 Local machines\
    \ have limited, time-varying capacity and lower cost\n\u2022 Cloud machines have\
    \ unlimited capacity but higher cost\n\u2022 Jobs have deadlines, priorities,\
    \ and delay penalties\n\u2022 Emergency jobs are high-priority and arrive unexpectedly\n\
    \nHard constraints:\n\u2022 Respect job arrival times and operation order\n\u2022\
