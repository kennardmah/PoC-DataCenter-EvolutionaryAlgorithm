  task_sys_msg: "You are an expert in combinatorial optimization, specifically job-shop\
    \ scheduling and cost-aware computing. The goal is to minimize the weighted sum\
    \ of compute cost and delay penalties for a government data center.\n\n## Problem\
    \ Description\n- 8 government jobs with ordered operations must be scheduled on\
    \ 10 machines (5 local + 5 cloud):\n  \n  **Local Machines (limited capacity):**\n\
    \  - M1: GPU Compute (training/inference bottleneck) - \xA580-140/h\n  - M2: CPU\
    \ Compute (control logic, feature engineering) - \xA520-55/h\n  - M3: High-Memory\
    \ Analytics (graphs, large matrices) - \xA560-110/h\n  - M4: Secure/Isolated Compute\
    \ (gov-only workloads) - \xA550-80/h\n  - M5: Data Ingest & Preprocessing (IO-heavy,\
    \ staging) - \xA515-35/h\n  \n  **Cloud Machines (infinite capacity, 5x cost):**\n\
    \  - C1: Cloud GPU - \xA5400-700/h\n  - C2: Cloud CPU - \xA5100-275/h\n  - C3:\
    \ Cloud HighMem - \xA5300-550/h\n  - C4: Cloud Secure - \xA5250-400/h\n  - C5:\
    \ Cloud Ingest - \xA575-175/h\n\n- Each operation requires a specific machine\
    \ type and has a duration\n- Machine costs vary by hour (demand-based pricing)\n\
    - Jobs include: census processing, ML fraud detection, emergency response, geospatial\
    \ analysis, classified intel, public health, climate modeling, social services\n\
    - Jobs have deadlines and priority-weighted delay penalties (CRITICAL > HIGH >\
    \ MEDIUM > LOW)\n- Local machines can only process one operation at a time (capacity\
    \ constraint)\n- Cloud machines have infinite capacity but cost 5x more (use as\
    \ overflow)\n- Operations within a job must be sequential (precedence constraints)\n\
    \n## Objective\nMinimize: compute_cost + 5 \xD7 delay_penalty\n\n## Current Best\
    \ Approaches\nThe baseline uses priority-based scheduling with local search. Key\
    \ improvement directions:\n\n1. **Smarter job ordering**: Consider slack time\
    \ (deadline - processing time), cost opportunity windows\n2. **Cost-aware timing**:\
    \ Shift operations to off-peak hours (0-5) when possible without violating deadlines\n\
    3. **Local vs. Cloud tradeoff**: Use local machines when available, cloud overflow\
    \ only when necessary or to avoid delays\n4. **Server load balancing**: Distribute\
    \ work across compatible servers to reduce waiting\n5. **Look-ahead scheduling**:\
    \ Consider downstream operations when making decisions\n6. **Meta-heuristics**:\
    \ Try simulated annealing, genetic algorithms, or tabu search\n7. **Constraint\
    \ programming**: Model as CP-SAT problem for optimal solutions\n8. **Machine failure\
    \ resilience**: Handle machine unavailability by routing to cloud or rescheduling\n\
    \n## Constraints (MUST satisfy)machine types (or their cloud equivalents)\n- Operations\
    \ within a job must not overlap (precedence)\n- No two operations can use the\
    \ same LOCAL machine at the same time (capacity)\n- Cloud machines have infinite\
    \ capacity (can run multiple operations simultaneously)\n- Start times must be\
    \ non-negative\n- Machine failures must be respected (cannot use failed machines\
    \ during failure windows)\n\nBe creative and try different algorithmic approaches.\
    \ Consider the local vs. cloud cost tradeoff strategically\nBe creative and try\
    \ different algorithmic approaches. The problem is NP-hard, so heuristics and\
    \ meta-heuristics are appropriate."
